# Include only in the jzis.org/www.jzis.org website server, not api.jzis.org.
location = /api/scwiki/v1 {
    include /etc/nginx/snippets/scwiki-proxy-common.conf;
}
location ^~ /api/scwiki/v1/ {
    include /etc/nginx/snippets/scwiki-proxy-common.conf;
}
location @scwiki_rate_limited {
    default_type application/json;
    add_header Retry-After "3" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 429 '{"code":"RATE_LIMITED","message":"Too many SCWiki requests. Wait before retrying."}';
}
