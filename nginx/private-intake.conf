# Location-only private transport policy. Install together with sclib.conf.
# This governs this proxy, not upstream applications, CDN/WAF/APM or host swap.
# API authentication, per-operation byte limits and absolute deadlines still apply.
limit_req zone=sclib_api burst=20 nodelay;
limit_req_status 429;
client_body_timeout 30s;
client_body_in_file_only off;
proxy_http_version 1.1;
proxy_request_buffering off;
proxy_buffering off;
proxy_ignore_headers X-Accel-Buffering;
proxy_max_temp_file_size 0;
proxy_cache off;
proxy_store off;
proxy_next_upstream off;
proxy_intercept_errors off;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
proxy_connect_timeout 5s;
# The longest current private API deadline is 100s; these are inactivity limits,
# not a total upload/runtime budget. Application absolute deadlines are unchanged.
proxy_read_timeout 120s;
proxy_send_timeout 120s;
send_timeout 30s;
access_log off;
# Nginx error/debug logs can include request URIs, queries or buffered data.
# Sacrifice path-local diagnostics; retain payload-free application metrics.
error_log /dev/null;
proxy_hide_header Cache-Control;
expires off;
add_header Cache-Control "private, no-store" always;
# Any local add_header suppresses inherited headers on older Nginx: repeat the
# complete API security set rather than silently dropping it for private routes.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
