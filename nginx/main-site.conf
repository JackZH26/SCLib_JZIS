# Root-mounted unified website. Render into the audited host configuration with
# scripts/prepare_site_integration.py; certificate paths come from that file.
server {
    server_name jzis.org www.jzis.org;
    @@TLS@@
    @@PRESERVED_INCLUDES@@

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/jzis;
        try_files $uri =404;
    }

    # Only old Next.js assets are retained, outside the former web root.
    # Before cutover copy the running frontend's .next/static contents here.
    location ^~ /sclib/_next/static/ {
        alias /var/lib/sclib/site-migration/legacy-static/;
        add_header Cache-Control "public, max-age=86400, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Tokens in old email links and callbacks must not enter access logs.
    location ~ ^/(sclib/)?(auth|dashboard|login|register|verify|reset-password|forgot-password)(/|$) {
        access_log off;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store, max-age=0" always;
        proxy_hide_header Referrer-Policy;
        add_header Referrer-Policy "no-referrer" always;
        proxy_read_timeout 60s;
    }

    # No static-file fallback: old HTML backups and assets are no longer public.
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
