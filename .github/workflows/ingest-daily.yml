name: Daily arXiv ingest

on:
  schedule:
    # Twice a day in UTC+8: 14:00 (morning submissions) and 22:00 (afternoon).
    - cron: "0 6 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:

concurrency:
  group: ingest-daily
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Probe the connection separately so a transient TCP timeout can be
      # retried without ever starting the long-running ingest twice.
      - name: Check VPS2 SSH connectivity
        id: ssh_preflight_primary
        continue-on-error: true
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS2_HOST }}
          username: ${{ secrets.VPS2_USER }}
          key: ${{ secrets.VPS2_SSH_KEY }}
          fingerprint: ${{ secrets.VPS2_HOST_FINGERPRINT }}
          port: 22
          timeout: 45s
          command_timeout: 1m
          script: "true"

      - name: Back off after transient SSH failure
        if: steps.ssh_preflight_primary.outcome == 'failure'
        run: sleep 15

      - name: Retry VPS2 SSH connectivity
        if: steps.ssh_preflight_primary.outcome == 'failure'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS2_HOST }}
          username: ${{ secrets.VPS2_USER }}
          key: ${{ secrets.VPS2_SSH_KEY }}
          fingerprint: ${{ secrets.VPS2_HOST_FINGERPRINT }}
          port: 22
          timeout: 90s
          command_timeout: 1m
          script: "true"

      - name: Trigger incremental ingest on VPS2
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_PATH: ${{ secrets.VPS2_DEPLOY_PATH }}
        with:
          host: ${{ secrets.VPS2_HOST }}
          username: ${{ secrets.VPS2_USER }}
          key: ${{ secrets.VPS2_SSH_KEY }}
          fingerprint: ${{ secrets.VPS2_HOST_FINGERPRINT }}
          port: 22
          timeout: 2m
          command_timeout: 55m
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            # The production script owns the single-instance lock and runs
            # incremental ingest, bounded retry, aggregate, stats refresh,
            # and a verified GCS backup using the last signed image manifest.
            bash scripts/cron_daily_ingest.sh
