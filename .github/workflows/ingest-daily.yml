name: Daily arXiv ingest

on:
  schedule:
    # Twice a day in UTC+8: 14:00 (morning submissions) and 22:00 (afternoon).
    - cron: "0 6 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:

concurrency:
  group: ingest-daily
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Trigger incremental ingest on VPS2
        uses: appleboy/ssh-action@823bd89e131d8d508129f9443cad5855e9ba96f0 # v1.2.4
        env:
          DEPLOY_PATH: ${{ secrets.VPS2_DEPLOY_PATH }}
        with:
          host: ${{ secrets.VPS2_HOST }}
          username: ${{ secrets.VPS2_USER }}
          key: ${{ secrets.VPS2_SSH_KEY }}
          fingerprint: ${{ secrets.VPS2_HOST_FINGERPRINT }}
          port: 22
          command_timeout: 55m
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            # The production script owns the single-instance lock and runs
            # incremental ingest, bounded retry, aggregate, stats refresh,
            # and a verified GCS backup using the last signed image manifest.
            bash scripts/cron_daily_ingest.sh
