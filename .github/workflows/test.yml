name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api-tests:
    name: API (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sclib_test
          POSTGRES_USER: sclib
          POSTGRES_PASSWORD: sclib_test_pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sclib -d sclib_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sclib:sclib_test_pw@localhost:5432/sclib_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test_jwt_secret_not_for_production_use_at_all
      ENVIRONMENT: test
      EMAIL_BACKEND: stdout
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install --upgrade pip uv
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Run tests
        run: pytest -q

  ingestion-tests:
    name: Ingestion (pytest, no production ingest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://sclib:sclib_test_pw@localhost:5432/sclib_test
    defaults:
      run:
        working-directory: ingestion
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install --upgrade pip uv
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Run unit tests only
        run: pytest -q

  frontend-build:
    name: Frontend (test + pnpm build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend regression tests
        run: pnpm test
      - name: Type-check and build
        run: pnpm build
