name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api-tests:
    name: API (pytest)
    runs-on: ubuntu-latest
    # Native regression exceeded 44 minutes after only four of eight batches.
    # These are bounded allowances, not measured Linux durations. Individual
    # disposable service capabilities still expire after one hour unchanged.
    timeout-minutes: 180
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Offline provenance tests compare retained bytes to a historical blob.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.16
      - name: Install dependencies
        run: uv sync --locked --extra dev --python 3.11
      - name: Verify connection-before-import safety guards (no services)
        run: .venv/bin/python -m unittest discover -s ../scripts/tests -p test_test_safety.py -v
      - name: Prepare hash-verified tokenizer data (dependency download)
        timeout-minutes: 2
        run: .venv/bin/python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"
      - name: Verify ML08 from the installed API wheel without repository imports
        timeout-minutes: 3
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/sclib-ml08-wheel" .
          .venv/bin/python -m venv "$RUNNER_TEMP/sclib-ml08-installed"
          "$RUNNER_TEMP/sclib-ml08-installed/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP/sclib-ml08-wheel/sclib_api-0.1.0-py3-none-any.whl"
          "$RUNNER_TEMP/sclib-ml08-installed/bin/python" -I ../scripts/probe_ml_pilot_install.py
          "$RUNNER_TEMP/sclib-ml08-installed/bin/python" -I ../scripts/probe_ml_pilot_registration_install.py
          "$RUNNER_TEMP/sclib-ml08-installed/bin/python" -I ../scripts/probe_ml_pilot_review_install.py
      - name: Verify installed evidence replay and corrupt-context rejection
        timeout-minutes: 3
        working-directory: .
        run: |
          api/.venv/bin/python -m scripts.tests.run_installed_evidence_probe \
            --python "$RUNNER_TEMP/sclib-ml08-installed/bin/python" \
            --wheel "$RUNNER_TEMP/sclib-ml08-wheel/sclib_api-0.1.0-py3-none-any.whl" \
            --output "$RUNNER_TEMP/sclib-installed-evidence.json"
      - name: Upload actual installed evidence replay report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-evidence-replay-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sclib-installed-evidence.json
          if-no-files-found: error
      - name: Verify all offline script contracts in the locked API runtime (no services)
        working-directory: .
        run: api/.venv/bin/python -m pytest -q scripts/tests
      - name: Capture test runtime dependency inventory
        run: |
          mkdir -p ../runtime-parity-api
          .venv/bin/python ../scripts/runtime_inventory.py --lock uv.lock --pyproject pyproject.toml --revision "$GITHUB_SHA" > ../runtime-parity-api/test-runtime.json
      - name: Compare built API release image with the locked test runtime
        run: .venv/bin/python ../scripts/run_runtime_parity.py --project api --tests ../runtime-parity-api/test-runtime.json --output ../runtime-parity-api
      - name: Prepare ephemeral service images
        run: |
          docker pull postgres:16-alpine
          docker pull redis:7-alpine
      - name: Run all API modules in separate owned-service batches
        timeout-minutes: 150
        working-directory: .
        run: api/.venv/bin/python -m scripts.tests.run_api_regression --backend docker --batches 8 --output "$RUNNER_TEMP/api-regression"
      - name: Upload actual API module-batch evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-regression-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/api-regression/
          if-no-files-found: error
      - name: Verify actual capacity boundaries in separate owned services
        run: .venv/bin/python ../scripts/run_disposable_tests.py --backend docker --suite api -- -q tests_capacity
      - name: Upload test runtime inventory
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-test-runtime-inventory-attempt-${{ github.run_attempt }}
          path: runtime-parity-api/
          if-no-files-found: error

  migration-tests:
    name: Migration (empty database to head)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.16
      - name: Install API dependencies
        run: uv sync --locked --extra dev --python 3.11
      - name: Prepare hash-verified tokenizer data (dependency download)
        timeout-minutes: 2
        run: .venv/bin/python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"
      - name: Capture migration runtime dependency inventory
        run: |
          mkdir -p ../runtime-parity-migration
          .venv/bin/python ../scripts/runtime_inventory.py --lock uv.lock --pyproject pyproject.toml --revision "$GITHUB_SHA" > ../runtime-parity-migration/test-runtime.json
      - name: Compare built API release image with the locked migration runtime
        run: .venv/bin/python ../scripts/run_runtime_parity.py --project api --tests ../runtime-parity-migration/test-runtime.json --output ../runtime-parity-migration
      - name: Prepare ephemeral service images
        run: |
          docker pull postgres:16-alpine
          docker pull redis:7-alpine
      - name: Upgrade and verify an owned disposable database
        run: .venv/bin/python ../scripts/run_disposable_tests.py --backend docker --suite migrations --report "$RUNNER_TEMP/schema-rehearsal.json"
      - name: Upload actual owned migration rehearsal evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schema-rehearsal-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/schema-rehearsal.json
          if-no-files-found: error
      - name: Upload migration runtime inventory
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migration-test-runtime-inventory-attempt-${{ github.run_attempt }}
          path: runtime-parity-migration/
          if-no-files-found: error

  ingestion-tests:
    name: Ingestion (pytest, no production ingest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Unit tests have no service. This cannot identify a real SCLib database.
      DATABASE_URL: postgresql://unavailable:unavailable@127.0.0.1:1/unavailable
    defaults:
      run:
        working-directory: ingestion
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.16
      - name: Install dependencies
        run: uv sync --locked --extra dev --python 3.11
      - name: Prepare hash-verified tokenizer data (dependency download)
        timeout-minutes: 2
        run: .venv/bin/python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"
      - name: Capture ingestion runtime dependency inventory
        run: |
          mkdir -p ../runtime-parity-ingestion
          .venv/bin/python ../scripts/runtime_inventory.py --lock uv.lock --pyproject pyproject.toml --revision "$GITHUB_SHA" > ../runtime-parity-ingestion/test-runtime.json
      - name: Compare built ingestion release image with the locked test runtime
        run: .venv/bin/python ../scripts/run_runtime_parity.py --project ingestion --tests ../runtime-parity-ingestion/test-runtime.json --output ../runtime-parity-ingestion
      - name: Run unit tests only
        run: .venv/bin/python -m pytest -q
      - name: Upload ingestion runtime inventory
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ingestion-test-runtime-inventory-attempt-${{ github.run_attempt }}
          path: runtime-parity-ingestion/
          if-no-files-found: error

  frontend-build:
    name: Frontend (test + pnpm build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.12.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend regression tests
        run: pnpm test
      - name: Type-check and build
        run: pnpm build

  frontend-e2e:
    name: Frontend (Playwright mobile E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.12.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Run production mobile E2E
        run: pnpm test:e2e
      - name: Run isolated private research workbench browsers
        timeout-minutes: 10
        env:
          SCLIB_RESEARCH_BROWSER_OUTPUT: ${{ runner.temp }}/sclib-research-browser
        run: node tests/e2e/run-research-workbenches.cjs
      - name: Upload private research browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: research-browser-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sclib-research-browser/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/playwright-results.json
          if-no-files-found: error
          retention-days: 14

  operations-config:
    name: Operations (SLO and monitoring config)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install config parser
        run: pip install --disable-pip-version-check pyyaml
      - name: Validate Compose and provisioning YAML
        run: |
          cp .env.example .env
          docker compose --profile observability config --quiet
          digest="sha256:$(printf '0%.0s' {1..64})"
          SCLIB_FRONTEND_IMAGE="ghcr.io/jackzh26/sclib-frontend@$digest" \
          SCLIB_API_IMAGE="ghcr.io/jackzh26/sclib-api@$digest" \
          SCLIB_INGESTION_IMAGE="ghcr.io/jackzh26/sclib-ingestion@$digest" \
            docker compose --profile observability \
              -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          python - <<'PY'
          import json
          from pathlib import Path

          import yaml

          for path in Path("ops").glob("**/*.yml"):
              with path.open(encoding="utf-8") as handle:
                  yaml.safe_load(handle)
          with Path("ops/grafana/dashboards/sclib-overview.json").open(
              encoding="utf-8"
          ) as handle:
              dashboard = json.load(handle)
          assert len(dashboard["panels"]) >= 8
          print("observability provisioning parsed")
          PY
      - name: Validate Prometheus and Alertmanager
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/ops/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.13.1 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint amtool \
            -v "$PWD/ops/alertmanager:/etc/alertmanager:ro" \
            quay.io/prometheus/alertmanager:v0.33.1 \
            check-config /etc/alertmanager/alertmanager.yml
      - name: Test release-gate calculations
        run: python -m unittest discover -s scripts/tests -p test_check_error_budget.py -v
      - name: Test private ingress source and observer contracts
        run: python -m unittest discover -s scripts/tests -p test_private_ingress.py -v
      - name: Build pinned Nginx and rehearse owned synthetic private ingress
        timeout-minutes: 5
        run: |
          # Development libraries only: no distro Nginx package/service install.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcre2-dev libssl-dev zlib1g-dev
          nginx_rehearsal_dir="$(mktemp -d "$RUNNER_TEMP/sclib-nginx.XXXXXX")"
          curl --fail --proto '=https' --tlsv1.2 --max-time 60 \
            --output "$nginx_rehearsal_dir/nginx.tar.gz" \
            https://nginx.org/download/nginx-1.30.4.tar.gz
          printf '%s  %s\n' \
            '4261dc90e9e47c1c4041276e9aaa3d48ebe2e664f728e14fa95ae6c67d57a08b' \
            "$nginx_rehearsal_dir/nginx.tar.gz" | sha256sum --check
          tar -xzf "$nginx_rehearsal_dir/nginx.tar.gz" -C "$nginx_rehearsal_dir" --no-same-owner
          (
            cd "$nginx_rehearsal_dir/nginx-1.30.4"
            ./configure --prefix="$nginx_rehearsal_dir/unused-install-prefix" --with-http_ssl_module
            make -j 2
          )
          python nginx/rehearse_private_intake.py \
            --nginx "$nginx_rehearsal_dir/nginx-1.30.4/objs/nginx" \
            --openssl "$(command -v openssl)" \
            --output "$RUNNER_TEMP/sclib-private-ingress.json"
      - name: Upload actual synthetic ingress evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: private-ingress-rehearsal-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sclib-private-ingress.json
          if-no-files-found: error
