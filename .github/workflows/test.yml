name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api-tests:
    name: API (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sclib_test
          POSTGRES_USER: sclib
          POSTGRES_PASSWORD: sclib_test_pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sclib -d sclib_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sclib:sclib_test_pw@localhost:5432/sclib_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test_jwt_secret_not_for_production_use_at_all
      ENVIRONMENT: test
      EMAIL_BACKEND: stdout
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install --upgrade pip uv
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Run tests
        run: pytest -q

  migration-tests:
    name: Migration (empty database to head)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sclib_migration_test
          POSTGRES_USER: sclib
          POSTGRES_PASSWORD: sclib_test_pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sclib -d sclib_migration_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sclib:sclib_test_pw@localhost:5432/sclib_migration_test
      JWT_SECRET: test_jwt_secret_not_for_production_use_at_all
      ENVIRONMENT: test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install --upgrade pip uv
      - name: Install API dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Upgrade empty database to migration head
        run: alembic upgrade head
      - name: Verify migration head and auth schema
        run: |
          CURRENT="$(alembic current | awk '{print $1}')"
          HEAD="$(alembic heads | awk '{print $1}')"
          test "$CURRENT" = "$HEAD"
          python - <<'PY'
          from sqlalchemy import create_engine, inspect
          from config import get_settings

          engine = create_engine(get_settings().database_url)
          schema = inspect(engine)
          assert {"password_reset_tokens", "auth_audit_events"} <= set(schema.get_table_names())
          user_columns = {column["name"] for column in schema.get_columns("users")}
          assert "session_version" in user_columns
          print("migration schema verified")
          PY

  ingestion-tests:
    name: Ingestion (pytest, no production ingest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://sclib:sclib_test_pw@localhost:5432/sclib_test
    defaults:
      run:
        working-directory: ingestion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install --upgrade pip uv
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Run unit tests only
        run: pytest -q

  frontend-build:
    name: Frontend (test + pnpm build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.12.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend regression tests
        run: pnpm test
      - name: Type-check and build
        run: pnpm build

  frontend-e2e:
    name: Frontend (Playwright mobile E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.12.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Run production mobile E2E
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  operations-config:
    name: Operations (SLO and monitoring config)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install config parser
        run: pip install --disable-pip-version-check pyyaml
      - name: Validate Compose and provisioning YAML
        run: |
          cp .env.example .env
          docker compose --profile observability config --quiet
          digest="sha256:$(printf '0%.0s' {1..64})"
          SCLIB_FRONTEND_IMAGE="ghcr.io/jackzh26/sclib-frontend@$digest" \
          SCLIB_API_IMAGE="ghcr.io/jackzh26/sclib-api@$digest" \
          SCLIB_INGESTION_IMAGE="ghcr.io/jackzh26/sclib-ingestion@$digest" \
            docker compose --profile observability \
              -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          python - <<'PY'
          import json
          from pathlib import Path

          import yaml

          for path in Path("ops").glob("**/*.yml"):
              with path.open(encoding="utf-8") as handle:
                  yaml.safe_load(handle)
          with Path("ops/grafana/dashboards/sclib-overview.json").open(
              encoding="utf-8"
          ) as handle:
              dashboard = json.load(handle)
          assert len(dashboard["panels"]) >= 8
          print("observability provisioning parsed")
          PY
      - name: Validate Prometheus and Alertmanager
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/ops/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.13.1 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint amtool \
            -v "$PWD/ops/alertmanager:/etc/alertmanager:ro" \
            quay.io/prometheus/alertmanager:v0.33.1 \
            check-config /etc/alertmanager/alertmanager.yml
      - name: Test release-gate calculations
        run: python -m unittest discover -s scripts/tests -v
