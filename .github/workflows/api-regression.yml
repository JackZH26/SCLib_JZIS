name: API regression modules

on:
  workflow_call:
    inputs:
      base:
        type: string
        required: true
      force_full:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Bind selection to the exact checked-out revision
        env:
          BASE: ${{ inputs.base }}
          FORCE_FULL: ${{ inputs.force_full }}
        run: |
          args=()
          if [[ "$FORCE_FULL" == "true" ]]; then args+=(--force-full); fi
          python -m scripts.api_test_scope plan --base "$BASE" "${args[@]}" --output "$RUNNER_TEMP/plan.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-selection-plan-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plan.json
          if-no-files-found: error

  modules:
    name: API modules ${{ matrix.shard }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-selection-plan-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/selection
      - name: Configure public image cache on the disposable runner
        run: python scripts/configure_ci_docker_mirror.py
      - name: Install locked API runtime
        working-directory: api
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.16
          uv sync --locked --extra dev --python 3.11
      - name: Verify connection-before-import safety guards
        run: api/.venv/bin/python -m unittest discover -s scripts/tests -p test_test_safety.py -v
      - name: Prepare hash-verified tokenizer and owned service images
        run: |
          api/.venv/bin/python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"
          docker pull postgres:16-alpine
          docker pull redis:7-alpine
      - name: Run isolated batch 0
        timeout-minutes: 28
        env:
          SHARD: ${{ matrix.shard }}
        run: api/.venv/bin/python -m scripts.api_test_scope batch --plan "$RUNNER_TEMP/selection/plan.json" --index "$((SHARD * 2 + 0))" --backend docker --output "$RUNNER_TEMP/batch-0"
      - name: Upload batch 0 outcomes and timings immediately
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-batch-${{ matrix.shard }}-0-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/batch-0/
          if-no-files-found: error
      - name: Run isolated batch 1
        timeout-minutes: 28
        env:
          SHARD: ${{ matrix.shard }}
        run: api/.venv/bin/python -m scripts.api_test_scope batch --plan "$RUNNER_TEMP/selection/plan.json" --index "$((SHARD * 2 + 1))" --backend docker --output "$RUNNER_TEMP/batch-1"
      - name: Upload batch 1 outcomes and timings immediately
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-batch-${{ matrix.shard }}-1-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/batch-1/
          if-no-files-found: error

  aggregate:
    name: Require every selected API module
    needs: [plan, modules]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-selection-plan-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/selection
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: api-batch-*-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/batches
      - name: Require all jobs and independently verify JUnit coverage
        env:
          MODULE_RESULT: ${{ needs.modules.result }}
        run: |
          test "$MODULE_RESULT" = success
          python -m scripts.api_test_scope aggregate --plan "$RUNNER_TEMP/selection/plan.json" --directory "$RUNNER_TEMP/batches" --output "$RUNNER_TEMP/api-summary.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-validation-summary-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/api-summary.json
          if-no-files-found: error
