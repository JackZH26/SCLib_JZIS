name: Private graph exporter

on:
  pull_request:
    branches: [main]
    paths:
      - ops/similar-frontier/**
      - .github/workflows/private-graph-export.yml
  push:
    branches: [main]
    paths:
      - ops/similar-frontier/**
      - .github/workflows/private-graph-export.yml

permissions:
  contents: read

concurrency:
  group: private-graph-export-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-check:
    name: Build and qualify the private exporter
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ steps.bundle.outputs.artifact_name }}
    env:
      PG_IMAGE: ghcr.io/jackzh26/sclib-postgres@sha256:3e4f23b5914cd58094c84ad6f06d8d6ad9e57223e11352dab04b91168100b121
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build from the pinned Ubuntu source package
        run: |
          docker build --platform linux/amd64 --tag sclib-private-export-ci \
            --file ops/similar-frontier/QemuExport.Dockerfile ops/similar-frontier
      - name: Extract the executable and corresponding source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private-export"
          container="$(docker create sclib-private-export-ci /qemu-storage-daemon)"
          trap 'docker rm -v "$container" >/dev/null' EXIT
          docker cp "$container:/qemu-storage-daemon" "$RUNNER_TEMP/private-export/qemu-storage-daemon"
          docker cp "$container:/build-source" "$RUNNER_TEMP/private-export/build-source"
          chmod 755 "$RUNNER_TEMP/private-export/qemu-storage-daemon"
          cp ops/similar-frontier/{check-sealed-export.py,QemuExport.Dockerfile,README.md} "$RUNNER_TEMP/private-export/"
      - name: Prepare the exact converter and pinned PostgreSQL reader
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-utils=1:8.2.2+ds-0ubuntu1.18 libfuse3-3
          echo '634320b91165669917123e8e79cce1c4d00cee0a4aa4d662d7c0a8186479b3fb  /usr/bin/qemu-img' | sha256sum --check
          sudo modprobe fuse
          docker pull "$PG_IMAGE"
      - name: Check cold readback, cache lifetime, ownership and write rejection
        shell: bash
        run: |
          set -euo pipefail
          ldd "$RUNNER_TEMP/private-export/qemu-storage-daemon" > "$RUNNER_TEMP/private-export/runtime-libraries.txt"
          ! grep -q 'not found' "$RUNNER_TEMP/private-export/runtime-libraries.txt"
          sudo systemd-run --quiet --wait --pipe --collect \
            --unit="sclib-private-export-check-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --property=MemoryMax=192M --property=MemorySwapMax=0 \
            --property=CPUQuota=100% --property=RuntimeMaxSec=120 \
            /usr/bin/python3 -B "$GITHUB_WORKSPACE/ops/similar-frontier/check-sealed-export.py" \
            --qemu-img /usr/bin/qemu-img \
            --daemon "$RUNNER_TEMP/private-export/qemu-storage-daemon" \
            --pg-image "$PG_IMAGE" > "$RUNNER_TEMP/private-export/qualification.json"
      - name: Bind qualified bytes and complete source to this revision
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'private-export'
          proof = json.loads((root / 'qualification.json').read_text())
          digest = hashlib.sha256((root / 'qemu-storage-daemon').read_bytes()).hexdigest()
          assert proof['status'] == 'sealed_export_verified' and proof['daemon_sha256'] == digest
          assert proof['owned_exports_released'] and proof['real_graph_queries'] == 0
          facts = dict(revision=os.environ['GITHUB_SHA'], source_package='1:8.2.2+ds-0ubuntu1.18',
                       purpose='isolated immutable graph construction only',
                       sha256={str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                               for p in sorted(root.rglob('*')) if p.is_file()})
          (root / 'manifest.json').write_text(json.dumps(facts, indent=2) + '\n')
          PY
          tar -C "$RUNNER_TEMP/private-export" -cf "$RUNNER_TEMP/private-export.tar" .
          echo "artifact_name=private-export-unsigned-$GITHUB_SHA-attempt-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Retain the qualified executable, source and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bundle.outputs.artifact_name }}
          path: ${{ runner.temp }}/private-export.tar
          if-no-files-found: error
          retention-days: 30

  sign:
    name: Sign after matching main Test and Security
    needs: build-and-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JackZH26/SCLib_JZIS'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require successful exact main workflows and the full regression gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 240); do
            ready=1
            test_run=""
            for workflow in test.yml security.yml; do
              payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&event=push&per_page=50")"
              matched="$(jq -c --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.id) | last' <<< "$payload")"
              if [[ "$matched" == null || "$(jq -r '.status' <<< "$matched")" != completed ]]; then
                ready=0
                continue
              fi
              [[ "$(jq -r '.conclusion' <<< "$matched")" == success ]]
              if [[ "$workflow" == test.yml ]]; then
                test_run="$(jq -r '.id' <<< "$matched")"
              fi
            done
            if [[ "$ready" == 1 ]]; then
              python3 -m scripts.check_api_full_gate --test-run "$test_run" --revision "$GITHUB_SHA"
              exit 0
            fi
            sleep 15
          done
          echo 'Matching main CI did not complete successfully within the bounded wait' >&2
          exit 1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-and-check.outputs.artifact_name }}
          path: ${{ runner.temp }}/signed-private-export
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.1
        with:
          cosign-release: v3.0.6
      - name: Sign the exact tested archive and verify its workflow identity
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/signed-private-export"
          cosign sign-blob --yes --bundle private-export.sigstore.json private-export.tar
          cosign verify-blob --bundle private-export.sigstore.json \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/private-graph-export.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com private-export.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: private-export-signed-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signed-private-export/
          if-no-files-found: error
          retention-days: 30
