name: PostgreSQL restore drill

on:
  schedule:
    - cron: "17 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-restore-drill
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sclib
          POSTGRES_USER: sclib
          POSTGRES_PASSWORD: restore_source_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sclib -d sclib"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sclib:restore_source_only@127.0.0.1:5432/sclib
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Create migrated source database
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.16
          UV_PROJECT_ENVIRONMENT=/tmp/sclib-restore-source \
            uv sync --project api --locked --no-dev --no-editable
          (cd api && /tmp/sclib-restore-source/bin/alembic upgrade head)
          source_container="$(docker ps --filter publish=5432 --format '{{.ID}}' | head -1)"
          test -n "$source_container"
          docker exec "$source_container" psql -X -v ON_ERROR_STOP=1 \
            -U sclib -d sclib -c \
            "INSERT INTO pipeline_state (key, value) VALUES ('restore_drill_marker', 'verified') ON CONFLICT (key) DO UPDATE SET value = EXCLUDED.value"
          docker exec "$source_container" pg_dump --format=custom --compress=9 \
            --no-owner --no-acl -U sclib -d sclib > /tmp/sclib-restore-drill.dump
          postgres_version="$(docker exec "$source_container" \
            psql -X -A -t -U sclib -d sclib -c 'SHOW server_version')"
          python3 scripts/backup_manifest.py create \
            --dump /tmp/sclib-restore-drill.dump \
            --output /tmp/sclib-restore-drill.manifest.json \
            --postgres-version "$postgres_version" \
            --git-sha "$GITHUB_SHA"
      - name: Restore and verify in isolated database
        run: |
          bash scripts/restore_postgres_drill.sh \
            --dump /tmp/sclib-restore-drill.dump \
            --manifest /tmp/sclib-restore-drill.manifest.json \
            --report /tmp/sclib-restore-drill-report.json
      - name: Upload drill evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postgres-restore-drill-${{ github.run_id }}
          path: /tmp/sclib-restore-drill-report.json
          if-no-files-found: error
          retention-days: 90
