name: Deploy to VPS2

on:
  workflow_run:
    workflows: [Release images]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful Release images workflow run ID for main
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: deploy-vps2
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'workflow_run' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Validate production connection settings
        env:
          VPS2_HOST: ${{ secrets.VPS2_HOST }}
          VPS2_USER: ${{ secrets.VPS2_USER }}
          VPS2_DEPLOY_PATH: ${{ secrets.VPS2_DEPLOY_PATH }}
          VPS2_HOST_FINGERPRINT: ${{ secrets.VPS2_HOST_FINGERPRINT }}
          VPS2_SSH_KEY: ${{ secrets.VPS2_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for variable in \
            VPS2_HOST VPS2_USER VPS2_DEPLOY_PATH \
            VPS2_HOST_FINGERPRINT VPS2_SSH_KEY; do
            [[ -n "${!variable}" ]] || {
              echo "missing production secret: $variable" >&2
              exit 1
            }
          done
          [[ "$VPS2_DEPLOY_PATH" == /* ]]
          [[ "$VPS2_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{40,50}={0,2}$ ]]
      - name: Resolve verified release run
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATIC_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.release_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            run_id="$MANUAL_RUN_ID"
          else
            run_id="$AUTOMATIC_RUN_ID"
          fi
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
          metadata="$(curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          jq --exit-status '
            .name == "Release images" and
            .path == ".github/workflows/release-images.yml" and
            .event == "workflow_run" and
            .head_branch == "main" and
            .conclusion == "success"
          ' <<< "$metadata" >/dev/null
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download signed image digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.release.outputs.run_id }}
          pattern: image-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/image-digests
      - name: Validate release manifest
        id: images
        env:
          DIGEST_DIR: ${{ runner.temp }}/image-digests
        shell: bash
        run: |
          set -euo pipefail
          target_sha=""
          for component in frontend api ingestion; do
            digest_file="$DIGEST_DIR/$component.digest"
            sha_file="$DIGEST_DIR/$component.sha"
            test -f "$digest_file"
            test -f "$sha_file"
            digest="$(tr -d '\r\n[:space:]' < "$digest_file")"
            component_sha="$(tr -d '\r\n[:space:]' < "$sha_file")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$component_sha" =~ ^[0-9a-f]{40}$ ]]
            if [[ -z "$target_sha" ]]; then
              target_sha="$component_sha"
            else
              [[ "$component_sha" == "$target_sha" ]]
            fi
            echo "$component=ghcr.io/jackzh26/sclib-$component@$digest" \
              >> "$GITHUB_OUTPUT"
          done
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
      - name: Deploy verified immutable images
        uses: appleboy/ssh-action@823bd89e131d8d508129f9443cad5855e9ba96f0 # v1.2.4
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.images.outputs.target_sha }}
          DEPLOY_PATH: ${{ secrets.VPS2_DEPLOY_PATH }}
          SCLIB_FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}
          SCLIB_API_IMAGE: ${{ steps.images.outputs.api }}
          SCLIB_INGESTION_IMAGE: ${{ steps.images.outputs.ingestion }}
        with:
          host: ${{ secrets.VPS2_HOST }}
          username: ${{ secrets.VPS2_USER }}
          key: ${{ secrets.VPS2_SSH_KEY }}
          fingerprint: ${{ secrets.VPS2_HOST_FINGERPRINT }}
          port: 22
          command_timeout: 25m
          envs: GHCR_USERNAME,GHCR_TOKEN,TARGET_SHA,DEPLOY_PATH,SCLIB_FRONTEND_IMAGE,SCLIB_API_IMAGE,SCLIB_INGESTION_IMAGE
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            git fetch --prune origin
            git cat-file -e "$TARGET_SHA^{commit}"
            git diff --quiet
            git diff --cached --quiet

            # Fail closed before any pull or migration if the 30-day SLO/error
            # budget is exhausted or Prometheus has insufficient data. Run
            # the tested revision from an isolated worktree so the deployed
            # checkout stays untouched if any preflight check fails.
            preflight_dir="$(mktemp -d)"
            cleanup_preflight() {
              git worktree remove --force "$preflight_dir" >/dev/null 2>&1 || true
              rm -rf "$preflight_dir"
            }
            trap cleanup_preflight EXIT
            git worktree add --detach "$preflight_dir" "$TARGET_SHA" >/dev/null
            python3 "$preflight_dir/scripts/check_error_budget.py" \
              --prometheus-url http://127.0.0.1:9090 --window 30d
            python3 "$preflight_dir/scripts/validate_gcp_credentials.py" validate \
              --credential /etc/sclib/credentials/api-external-account.json \
              --expected-service-account sclib-api@jzis-sclib.iam.gserviceaccount.com
            python3 "$preflight_dir/scripts/validate_gcp_credentials.py" validate \
              --credential /etc/sclib/credentials/ingestion-external-account.json \
              --expected-service-account sclib-ingestion@jzis-sclib.iam.gserviceaccount.com
            python3 "$preflight_dir/scripts/validate_gcp_credentials.py" validate \
              --credential /etc/sclib/credentials/backup-external-account.json \
              --expected-service-account sclib-backup@jzis-sclib.iam.gserviceaccount.com
            cleanup_preflight
            trap - EXIT

            git switch --detach "$TARGET_SHA"
            export GIT_SHA="$(git rev-parse --short=7 "$TARGET_SHA")"
            bash scripts/backup_postgres.sh
            bash scripts/install_cosign.sh
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
              --username "$GHCR_USERNAME" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            identity='https://github.com/JackZH26/SCLib_JZIS/.github/workflows/release-images.yml@refs/heads/main'
            issuer='https://token.actions.githubusercontent.com'
            for image in \
              "$SCLIB_FRONTEND_IMAGE" \
              "$SCLIB_API_IMAGE" \
              "$SCLIB_INGESTION_IMAGE"; do
              cosign verify \
                --certificate-identity "$identity" \
                --certificate-oidc-issuer "$issuer" \
                "$image" >/dev/null
              docker pull "$image"
            done

            compose=(docker compose --profile observability \
              -f docker-compose.yml -f docker-compose.prod.yml)
            "${compose[@]}" up -d --no-build --wait --wait-timeout 60 \
              postgres redis
            "${compose[@]}" run --rm --no-deps api alembic upgrade head
            "${compose[@]}" up -d --no-build --wait --wait-timeout 180 \
              postgres redis api frontend prometheus alertmanager grafana
            "${compose[@]}" ps

            # Read-only smoke checks: local/public health, deployed revision,
            # and the existing public frontend. No ingest or data mutation.
            curl --retry 12 --retry-delay 5 --retry-connrefused \
              --max-time 10 --fail --silent --show-error \
              http://127.0.0.1:8000/v1/health >/dev/null
            curl --max-time 15 --fail --silent --show-error \
              https://api.jzis.org/sclib/v1/health >/dev/null
            version_json="$(curl --max-time 15 --fail --silent --show-error \
              https://api.jzis.org/sclib/v1/version)"
            case "$version_json" in
              *\"site_version\":\"$GIT_SHA\"*) ;;
              *) echo "deployed revision mismatch: $version_json"; exit 1 ;;
            esac
            curl --max-time 15 --fail --silent --show-error \
              https://jzis.org/sclib/ >/dev/null

            # Persist only after every smoke check succeeds. Scheduled ingest
            # and aggregation then reuse the exact signed immutable images
            # from this deployment instead of a stale local build.
            umask 077
            release_env="$(mktemp "$DEPLOY_PATH/.env.release.XXXXXX")"
            printf 'SCLIB_FRONTEND_IMAGE=%s\nSCLIB_API_IMAGE=%s\nSCLIB_INGESTION_IMAGE=%s\n' \
              "$SCLIB_FRONTEND_IMAGE" \
              "$SCLIB_API_IMAGE" \
              "$SCLIB_INGESTION_IMAGE" > "$release_env"
            mv -f "$release_env" "$DEPLOY_PATH/.env.release"
