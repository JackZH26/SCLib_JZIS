services:
  frontend:
    build:
      context: ./frontend
      # GIT_SHA defaults to "dev" so local `docker compose build` works
      # without setting the env. Production deploys (deploy.yml + the
      # manual VPS2 steps) export GIT_SHA=$(git rev-parse --short HEAD)
      # before invoking compose so the running image carries the real
      # commit. Surfaced on the site footer + GET /version.
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        NEXT_PUBLIC_WEB_VITALS_SAMPLE_RATE: ${NEXT_PUBLIC_WEB_VITALS_SAMPLE_RATE:-0.1}
    container_name: sclib-frontend
    restart: unless-stopped
    # VPS2 already runs asrp.jzis.org on host port 3000 — bind the
    # SCLib frontend to 3100 instead and point Nginx at that. Never
    # collide with existing sites, per CLAUDE.md.
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=https://api.jzis.org/sclib/v1
      # Server-side fetches (SSR in Next) take the in-cluster URL so
      # page rendering doesn't hairpin through Nginx + TLS.
      - API_BASE_SERVER=http://api:8000/v1
      - NODE_ENV=production
    # With basePath=/sclib baked in, Next.js 404s on bare / and serves
    # the app under /sclib. Probe that path for liveness.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/sclib >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ./api
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    container_name: sclib-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/credentials/gcp-api.json
    volumes:
      - ./credentials/gcp-api.json:/credentials/gcp-api.json:ro
      - ${SCLIB_DISCOVERY_DIR:-/data/sclib/discovery}:/data/sclib/discovery:ro
      # One-shot scripts (refresh_stats.py, sync_mp_ids.py, …) live in
      # the repo's top-level scripts/ dir, but the api image's build
      # context is ./api so they are not baked in. Mount them read-only
      # so `docker compose exec api python /app/scripts/foo.py` works
      # without a rebuild whenever a script is added or edited.
      - ./scripts:/app/scripts:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "4", "http://127.0.0.1:8000/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ingestion:
    build: ./ingestion
    container_name: sclib-ingestion
    # One-shot job: invoked via `docker compose run --rm ingestion ...`,
    # never as a daemon. `profiles` keeps it out of `docker compose up`.
    profiles: ["tools"]
    # APS full-text ZIPs are extracted under /dev/shm by default for
    # compliance (transient RAM-backed storage). Docker's default shm
    # size is only 64 MB, which is too small for some modern APS BagIt
    # packages (e.g. ~70 MB compressed before unzip). Give one-shot
    # ingestion runs enough headroom so they fail on real errors rather
    # than an artificial tmpfs cap.
    shm_size: "2gb"
    env_file: .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/credentials/gcp-ingestion.json
    volumes:
      - ./credentials/gcp-ingestion.json:/credentials/gcp-ingestion.json:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: sclib-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sclib
      POSTGRES_USER: sclib
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sclib -d sclib"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Internal only — no ports exposed

  redis:
    image: redis:7-alpine
    container_name: sclib-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Internal only — no ports exposed

  prometheus:
    image: prom/prometheus:v3.13.1-distroless
    container_name: sclib-prometheus
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --web.enable-lifecycle
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      api:
        condition: service_healthy

  alertmanager:
    image: quay.io/prometheus/alertmanager:v0.33.1
    container_name: sclib-alertmanager
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./ops/alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"

  grafana:
    image: grafana/grafana:13.1.3
    container_name: sclib-grafana
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-observability-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://127.0.0.1:3200
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3200:3000"
    depends_on:
      - prometheus
      - alertmanager

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
