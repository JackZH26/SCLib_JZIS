# Production override for VPS2.
# Production requires three distinct, keyless Workload Identity Federation
# configurations. Human ADC, refresh tokens, and service-account keys are
# rejected by scripts/validate_gcp_credentials.py before a process starts.
services:
  alertmanager:
    # Provision the approved receiver outside Git before production admission.
    volumes:
      - /etc/sclib/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - /etc/sclib/credentials/alertmanager-smtp-password:/run/secrets/sclib-alertmanager-smtp-password:ro

  frontend:
    image: ${SCLIB_FRONTEND_IMAGE:?set signed frontend image digest}

  api:
    image: ${SCLIB_API_IMAGE:?set signed API image digest}
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /credentials/gcp-api.json
      SCLIB_EXPECTED_GCP_SERVICE_ACCOUNT: sclib-api@jzis-sclib.iam.gserviceaccount.com
      SCLIB_IDENTITY_TOKEN_PREFIX: /var/run/sclib-identity
    entrypoint:
      - python
      - /app/scripts/validate_gcp_credentials.py
      - exec
      - --
      - /app/entrypoint.sh
    # Compose clears the image CMD when this entrypoint is overridden on some
    # engine versions. Keep the production process explicit so the credential
    # validator cannot exit successfully without starting the API.
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    volumes:
      - /etc/sclib/credentials/api-external-account.json:/credentials/gcp-api.json:ro
      - /run/sclib-identity/api:/var/run/sclib-identity/api:ro

  migration:
    image: ${SCLIB_API_IMAGE:?set signed API image digest}
    environment:
      # No fallback to API credentials in production. This file is provisioned
      # separately for a migration-only PostgreSQL role; never put it in .env.
      DATABASE_URL: ""
      SCLIB_MIGRATION_DATABASE_URL_FILE: /run/secrets/sclib-migration-database-url
    volumes:
      - /etc/sclib/credentials/migration-database-url:/run/secrets/sclib-migration-database-url:ro

  ingestion:
    image: ${SCLIB_INGESTION_IMAGE:?set signed ingestion image digest}
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /credentials/gcp-ingestion.json
      SCLIB_EXPECTED_GCP_SERVICE_ACCOUNT: sclib-ingestion@jzis-sclib.iam.gserviceaccount.com
      SCLIB_IDENTITY_TOKEN_PREFIX: /var/run/sclib-identity
    entrypoint:
      - /bin/sh
      - /app/scripts/ingestion_pause_guard.sh
      - python
      - /app/scripts/validate_gcp_credentials.py
      - exec
      - --
    volumes:
      - /etc/sclib/credentials/ingestion-external-account.json:/credentials/gcp-ingestion.json:ro
      - /run/sclib-identity/ingestion:/var/run/sclib-identity/ingestion:ro
