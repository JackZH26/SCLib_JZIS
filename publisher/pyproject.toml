[project]
name = "sclib-native-publisher"
version = "0.1.0"
description = "Explicit native publication bridge for completed SCLib ingestion"
requires-python = ">=3.11"
dependencies = ["sclib-api==0.1.0", "sclib-ingestion==0.1.0", "jsonschema>=4.26,<5"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
sclib-publish-native = "native_publisher.cli:main"
sclib-stage-native-batch = "native_publisher.batch_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["native_publisher"]

[tool.uv.sources]
sclib-api = { path = "../api" }
sclib-ingestion = { path = "../ingestion" }

[tool.uv]
constraint-dependencies = ["dnspython>=2.9.0", "joserfc>=1.7.6", "pyasn1>=0.6.5"]
