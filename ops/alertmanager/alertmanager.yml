global:
  resolve_timeout: 5m

route:
  receiver: operator-console
  group_by: [alertname, severity, slo]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  # Safe repository default: alerts remain visible in Alertmanager and Grafana.
  # Before production enablement, add the operator-approved email, Slack, or
  # PagerDuty receiver described in docs/OBSERVABILITY_SLO.md.
  - name: operator-console

inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [alertname]
