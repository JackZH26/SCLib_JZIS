# Loaded only after the operator creates /etc/sclib/pgvector-api.env.
# Each independently scraped API process shares the database-wide ANN budget.
x-pgvector-api: &pgvector-api
  image: ${SCLIB_API_IMAGE:?set signed API image digest}
  profiles: [pgvector-api]
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 1g
  memswap_limit: 1g
  tmpfs: ["/tmp:rw,nosuid,noexec,size=64m"]
  env_file: .env
  environment:
    DB_PASSWORD: ""
    GRAFANA_ADMIN_PASSWORD: ""
    GOOGLE_APPLICATION_CREDENTIALS: /credentials/gcp-api.json
    SCLIB_EXPECTED_GCP_SERVICE_ACCOUNT: sclib-api@jzis-sclib.iam.gserviceaccount.com
    SCLIB_IDENTITY_TOKEN_PREFIX: /var/run/sclib-identity
    RETRIEVAL_BACKEND: pgvector
    MATERIALS_VNEXT_ENABLED: ${SCLIB_MATERIALS_VNEXT_ENABLED:-false}
    MATERIALS_DATASET_DOWNLOAD_ROOT: /data/sclib/materials-vnext/downloads
    SCLIB_STATS_REFRESH_INTERVAL_SEC: "0"
    SCLIB_TIMELINE_PROJECTION_INTERVAL_SEC: "0"
    SCLIB_FORMULA_AUDIT_INTERVAL_SEC: "0"
    SCLIB_NIGHTLY_AUDIT_HOUR_UTC: "-1"
    SCLIB_ASK_HISTORY_PRUNE_INTERVAL_SEC: "0"
  volumes:
    - /etc/sclib/credentials/api-external-account.json:/credentials/gcp-api.json:ro
    - /run/sclib-identity/api:/var/run/sclib-identity/api:ro
    - ./scripts:/app/scripts:ro
    - ${SCLIB_DISCOVERY_DIR:-/data/sclib/discovery}:/data/sclib/discovery:ro
    - type: bind
      source: ${SCLIB_MATERIALS_DATASET_DIR:?set verified Materials download snapshot directory}
      target: /data/sclib/materials-vnext/downloads
      read_only: true
      bind:
        create_host_path: false
  entrypoint: [python, /app/scripts/validate_gcp_credentials.py, exec, --, /app/entrypoint.sh]
  command: [uvicorn, main:app, --host, 0.0.0.0, --port, "8000"]
  healthcheck:
    test: [CMD, curl, -fsS, --max-time, "4", http://127.0.0.1:8000/readyz]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 30s
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  api:
    environment:
      RETRIEVAL_BACKEND: ${SCLIB_MAIN_RETRIEVAL_BACKEND:-google}
  ingestion:
    environment:
      RETRIEVAL_BACKEND: pgvector
  api-pgvector-1:
    <<: *pgvector-api
    container_name: sclib-pgvector-api-1
    cpus: 2
    ports: ["127.0.0.1:8002:8000"]
  api-pgvector-2:
    <<: *pgvector-api
    container_name: sclib-pgvector-api-2
    cpus: 2
    ports: ["127.0.0.1:8003:8000"]
  api-pgvector-3:
    <<: *pgvector-api
    container_name: sclib-pgvector-api-3
    cpus: 1
    ports: ["127.0.0.1:8004:8000"]
  api-pgvector-4:
    <<: *pgvector-api
    container_name: sclib-pgvector-api-4
    cpus: 1
    ports: ["127.0.0.1:8005:8000"]
  prometheus:
    command:
      - --config.file=/etc/prometheus/pgvector-api.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --web.enable-lifecycle
